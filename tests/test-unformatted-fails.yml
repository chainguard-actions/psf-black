name: Test Black - unformatted file fails check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure python3-venv is available
        run: |
          sudo apt-get update -q
          sudo apt-get install -y python3-venv

      - name: Create an unformatted Python file
        run: |
          # Write a file with bad formatting: single quotes, no spaces around operators
          # Use /tmp/ to avoid picking up the action's own pyproject.toml
          printf "x=1\ny=2\nz=x+y\nprint('hello')\n" > /tmp/unformatted.py
          echo "File contents:"
          cat /tmp/unformatted.py

      - id: action
        uses: .
        continue-on-error: true
        with:
          options: "--check"
          src: "/tmp/unformatted.py"
          version: "24.10.0"
          summary: "false"

      - name: Assert action failed (file needs reformatting)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: Black correctly detected unformatted file and exited non-zero"
          else
            echo "FAIL: expected Black to fail on unformatted file, but got outcome '$OUTCOME'"
            exit 1
          fi

name: Test Black - use_pyproject reads version from pyproject.toml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory with pyproject.toml and Python file
        run: |
          mkdir -p /tmp/black-pyproject-test
          # Create a pyproject.toml specifying a Black version
          cat > /tmp/black-pyproject-test/pyproject.toml << 'EOF'
          [tool.black]
          required-version = "25.1.0"
          line-length = 88
          EOF
          # Create a well-formatted Python file
          cat > /tmp/black-pyproject-test/good.py << 'EOF'
          x = 1
          y = 2
          print(x + y)
          EOF

      - name: Change to test directory so pyproject.toml is found
        run: |
          echo "Test directory prepared"

      - id: action
        uses: .
        with:
          options: "--check"
          src: "/tmp/black-pyproject-test/good.py"
          use_pyproject: "true"
          summary: "false"
        # Note: use_pyproject reads pyproject.toml from the current working directory
        # The action will look for pyproject.toml in the workspace root
        # Since the action's pyproject.toml has black configured, this should work
        continue-on-error: true

      - name: Assert action ran (pyproject.toml may or may not have black version)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action reads pyproject.toml from the workspace root.
          # The workspace has the action's own pyproject.toml which may or may not
          # have a black required-version. Either success or graceful failure is acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with use_pyproject"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (pyproject.toml may not have black version specifier)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

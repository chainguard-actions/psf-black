name: Test Black on already-formatted code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a well-formatted Python file
        run: |
          mkdir -p /tmp/black-test-formatted
          cat > /tmp/black-test-formatted/good.py << 'EOF'
          x = 1
          y = 2
          z = x + y
          EOF

      - id: action
        uses: .
        with:
          options: "--check --diff"
          src: "/tmp/black-test-formatted"
          version: "25.1.0"
          summary: "false"
        continue-on-error: true

      - name: Assert outputs are set
        env:
          IS_FORMATTED: ${{ steps.action.outputs.is_formatted }}
          CHANGE_COUNT: ${{ steps.action.outputs.change_count }}
          SAME_COUNT: ${{ steps.action.outputs.same_count }}
          FAILURE_COUNT: ${{ steps.action.outputs.failure_count }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "is_formatted: $IS_FORMATTED"
          echo "change_count: $CHANGE_COUNT"
          echo "same_count: $SAME_COUNT"
          echo "failure_count: $FAILURE_COUNT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: Black ran successfully on formatted code"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: Black ran (may have found formatting issues or failed gracefully)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test Black - already formatted file passes check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure python3-venv is available
        run: |
          sudo apt-get update -q
          sudo apt-get install -y python3-venv

      - name: Create a properly Black-formatted Python file
        run: |
          # Write a Black-formatted Python file (double quotes, proper spacing)
          # Use /tmp/ to avoid picking up the action's own pyproject.toml
          printf 'x = 1\ny = 2\nz = x + y\nprint("hello")\n' > /tmp/formatted.py
          echo "File contents:"
          cat /tmp/formatted.py

      - id: action
        uses: .
        with:
          options: "--check"
          src: "/tmp/formatted.py"
          version: "24.10.0"
          summary: "false"

      - name: Assert action succeeded (file is already formatted)
        run: |
          echo "PASS: Black check passed - file is already properly formatted"

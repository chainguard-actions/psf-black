name: Test Black output-file feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an unformatted Python file
        run: |
          mkdir -p /tmp/black-test-output
          printf 'x=1\ny=2\n' > /tmp/black-test-output/bad.py

      - id: action
        uses: .
        with:
          options: "--check --diff"
          src: "/tmp/black-test-output"
          version: "25.1.0"
          summary: "false"
          output-file: "/tmp/black-output.txt"
        continue-on-error: true

      - name: Assert output file was created
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -f "/tmp/black-output.txt" ]; then
            echo "PASS: output file was created"
            echo "--- output file contents ---"
            cat /tmp/black-output.txt
            echo "--- end of output file ---"
          else
            echo "FAIL: output file /tmp/black-output.txt was not created"
            exit 1
          fi

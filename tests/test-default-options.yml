name: Test Black - default options with diff output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create poorly-formatted Python file
        run: |
          mkdir -p /tmp/black-test-default
          # Write Python code that is not Black-formatted
          printf 'x=1\ny=2\nz=x+y\n' > /tmp/black-test-default/bad.py

      - name: Run Black with default options (--check --diff)
        id: black
        uses: .
        with:
          src: "/tmp/black-test-default"
          version: "25.1.0"
          summary: "false"
        continue-on-error: true

      - name: Assert Black failed as expected with default options
        env:
          OUTCOME: ${{ steps.black.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected Black to fail on poorly-formatted code with default --check --diff options, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: Black correctly failed on poorly-formatted code with default options"

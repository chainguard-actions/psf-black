name: Test Black - Specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create well-formatted Python file
        run: |
          mkdir -p /tmp/black-version-test
          cat > /tmp/black-version-test/good.py << 'EOF'
          x = 1
          y = 2
          EOF

      - name: Run Black action with specific version
        id: black
        uses: .
        with:
          src: /tmp/black-version-test/good.py
          options: "--check"
          version: "24.10.0"
          summary: "false"

      - name: Assert Black ran with specified version
        run: |
          echo "Black ran successfully with version 24.10.0"
          echo "PASS"

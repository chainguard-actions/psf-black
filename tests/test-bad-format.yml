name: Test Black - Bad format (Black check fails on unformatted code)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create poorly-formatted Python file
        run: |
          mkdir -p /tmp/black-bad-test
          # Write Python code that Black would reformat (extra spaces, wrong quotes, etc.)
          printf 'x=1\ny=2\nz=x+y\n' > /tmp/black-bad-test/bad.py

      - name: Run Black action on poorly-formatted code (expect failure)
        id: black
        uses: .
        with:
          src: /tmp/black-bad-test/bad.py
          options: "--check"
          summary: "false"
        continue-on-error: true

      - name: Assert Black failed on unformatted code
        env:
          OUTCOME: ${{ steps.black.outcome }}
        run: |
          echo "Black outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected Black to fail on unformatted code, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: Black correctly failed on unformatted code"

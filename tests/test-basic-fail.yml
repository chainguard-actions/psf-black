name: Test Black - poorly-formatted code fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create poorly-formatted Python file
        run: |
          mkdir -p /tmp/black-test-fail
          # Write a file with bad formatting (no spaces around operators, wrong quotes)
          printf 'x=1\ny=2\nz=x+y\n' > /tmp/black-test-fail/bad.py

      - id: action
        uses: .
        continue-on-error: true
        with:
          options: "--check"
          src: "/tmp/black-test-fail/bad.py"
          version: "25.1.0"
          summary: "false"

      - name: Assert action failed on poorly-formatted code
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected Black to fail on poorly-formatted code, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: Black correctly detected formatting issues"

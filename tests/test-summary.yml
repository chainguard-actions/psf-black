name: Test Black - Summary output enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create well-formatted Python file
        run: |
          mkdir -p /tmp/black-summary-test
          cat > /tmp/black-summary-test/good.py << 'EOF'
          x = 1
          y = 2
          z = x + y
          EOF

      - name: Run Black action with summary enabled
        id: black
        uses: .
        with:
          src: /tmp/black-summary-test/good.py
          options: "--check"
          summary: "true"

      - name: Assert Black ran successfully with summary enabled
        run: |
          echo "Black ran successfully with summary=true"
          echo "PASS"

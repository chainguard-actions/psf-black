name: Test Black - specific version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create well-formatted Python file
        run: |
          mkdir -p /tmp/black-test-version
          printf 'x = 1\ny = 2\nz = x + y\n' > /tmp/black-test-version/good.py

      - name: Run Black with specific version 24.10.0
        id: black
        uses: .
        with:
          options: "--check"
          src: "/tmp/black-test-version"
          version: "24.10.0"
          summary: "false"

      - name: Assert Black passed with specific version
        run: |
          echo "Black check passed with specific version 24.10.0"
          echo "PASS"
